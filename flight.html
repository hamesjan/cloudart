<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bare Bones Flight (Gamepad)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#142033; }
    #hud {
      position: fixed; left: 12px; top: 12px; color: #dff; 
      font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-shadow: 0 0 6px #0ff7; white-space: pre; user-select: none;
    }
    #help {
      position: fixed; right: 12px; top: 12px; color:#fff; opacity:.9;
      font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: right; max-width: 42ch; user-select: none;
    }
  </style>
</head>
<body>
<div id="hud"></div>
<div id="help">
  <b>Controls</b><br>
  Left stick: pitch/roll<br>
  LB / RB: yaw<br>
  Btn 0: throttle up &nbsp;•&nbsp; Btn 1: throttle down<br>
  Keyboard: W/S (pitch), A/D (roll), Q/E (yaw), Space/Shift (throttle)
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.159.0/build/three.module.js';

const hud = document.getElementById('hud');

// --- Renderer / Scene / Camera ---
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2b4a);

// Simple bright lighting
scene.add(new THREE.HemisphereLight(0xbbeeff, 0x0a0f16, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 10);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2000);

// --- Simple World: ground grid + a few boxes as reference ---
const ground = new THREE.GridHelper(4000, 200, 0x3ac7ff, 0x154e7a);
ground.position.y = -5;
scene.add(ground);

const refGroup = new THREE.Group();
scene.add(refGroup);
for (let i=0;i<60;i++){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(4, THREE.MathUtils.randFloat(4,14), 4),
    new THREE.MeshStandardMaterial({ color: 0x7dd3fc, metalness:0.1, roughness:0.6 })
  );
  const r = THREE.MathUtils.randFloat(40, 400);
  const a = Math.random()*Math.PI*2;
  m.position.set(Math.cos(a)*r, m.geometry.parameters.height/2 - 5, Math.sin(a)*r);
  refGroup.add(m);
}

// --- "Ship" (simple cone + wings) ---
const ship = new THREE.Group();
{
  const hull = new THREE.Mesh(
    new THREE.ConeGeometry(0.8, 2.8, 6),
    new THREE.MeshStandardMaterial({ color: 0x8bf6ff, metalness:0.2, roughness:0.3, emissive:0x1c7ea3, emissiveIntensity:0.25 })
  );
  hull.rotation.z = Math.PI; // point forward
  hull.position.y = 0.25;
  ship.add(hull);

  const wings = new THREE.Mesh(
    new THREE.BoxGeometry(3.0, 0.08, 0.3),
    new THREE.MeshStandardMaterial({ color: 0xff9bd4, metalness:0.2, roughness:0.45, emissive:0x8a2a60, emissiveIntensity:0.15 })
  );
  wings.position.set(0, 0, -0.2);
  ship.add(wings);
}
ship.position.set(0, 4, 0);
scene.add(ship);

// --- Chase camera setup ---
function updateChaseCam() {
  // Place camera slightly behind and above the ship (in ship local space)
  const behind = new THREE.Vector3(0, 1.2, 5.2); // positive Z is "back" because ship faces -Z
  const target = ship.localToWorld(behind.clone());
  camera.position.lerp(target, 0.15);
  camera.lookAt(ship.position);
}
camera.position.set(0, 6, 8);
camera.lookAt(ship.position);

// --- Input (Gamepad + Keyboard) ---
const keys = new Set();
addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

let padIndex = null;
function getPad(){
  const pads = navigator.getGamepads?.() || [];
  if (padIndex==null){
    for (let i=0;i<pads.length;i++) if (pads[i]) { padIndex = i; break; }
  }
  return padIndex!=null ? pads[padIndex] : null;
}

// Deadzone + calibration
const DEADZONE = 0.12;
// Seed with your measured centers:
let centerX = -0.22, centerY = -0.38;
// Brief auto-calibration while stick is near center
let calibFrames = 0, calibrated = false;

function axisWithDeadzone(v, center, dz=DEADZONE){
  const d = v - center;
  if (Math.abs(d) < dz) return 0;
  return (Math.abs(d)-dz)/(1-dz) * Math.sign(d);
}

// --- Flight state ---
let throttle = 0.45;                     // 0..1.5
const throttleMin = 0.15, throttleMax = 1.5, throttleAccel = 0.8;

let pitch = 0, yaw = 0, roll = 0;        // radians
const pitchRate = 1.8, yawRate = 1.6, rollRate = 2.2;
const autoLevel = 0.9, maxBank = 0.75;   // ~43deg
const cruiseSpeed = 35;                  // units/sec at throttle=1

// --- Time + loop ---
let last = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (now-last)/1000); last = now;

  // ----- Read input -----
  let iPitch=0, iRoll=0, iYaw=0, tUp=false, tDown=false;

  const pad = getPad();
  if (pad){
    const ax0 = pad.axes[0] ?? 0; // left stick X
    const ax1 = pad.axes[1] ?? 0; // left stick Y

    // center auto-calibration for first ~1s while near center
    const nearCenter = Math.hypot(ax0-centerX, ax1-centerY) < 0.20;
    if (!calibrated && nearCenter && calibFrames < 60) {
      centerX = (centerX*calibFrames + ax0) / (calibFrames+1);
      centerY = (centerY*calibFrames + ax1) / (calibFrames+1);
      calibFrames++;
      if (calibFrames >= 60) calibrated = true;
    }

    const stickX = axisWithDeadzone(ax0, centerX);
    const stickY = axisWithDeadzone(ax1, centerY);

    // Map left stick → roll & pitch (invert Y so up = pitch up)
    iRoll  = -stickX;
    iPitch = -stickY;

    // Yaw from LB/RB (buttons 4/5); fall back to triggers as axes (2/5 on many pads)
    const lb = !!pad.buttons[4]?.pressed;
    const rb = !!pad.buttons[5]?.pressed;
    const ltAxis = (pad.axes[2] ?? 0) > 0.35;
    const rtAxis = (pad.axes[5] ?? 0) > 0.35;
    iYaw = (rb || rtAxis ? 1:0) - (lb || ltAxis ? 1:0);

    tUp   = !!pad.buttons[0]?.pressed; // Button 0 = throttle up (hold)
    tDown = !!pad.buttons[1]?.pressed; // Button 1 = throttle down (hold)
  }

  // Keyboard fallback
  if (keys.size){
    if (keys.has('w') || keys.has('arrowup'))    iPitch += 1;
    if (keys.has('s') || keys.has('arrowdown'))  iPitch -= 1;
    if (keys.has('a') || keys.has('arrowleft'))  iRoll  += 1;
    if (keys.has('d') || keys.has('arrowright')) iRoll  -= 1;
    if (keys.has('q')) iYaw -= 1;
    if (keys.has('e')) iYaw += 1;
    if (keys.has(' ')) tUp = true;
    if (keys.has('shift')) tDown = true;
  }

  // ----- Throttle -----
  if (tUp)   throttle = Math.min(throttleMax, throttle + throttleAccel*dt);
  if (tDown) throttle = Math.max(throttleMin, throttle - throttleAccel*dt);

  // ----- Integrate attitude -----
  pitch = THREE.MathUtils.clamp(pitch + iPitch*pitchRate*dt, -0.9, 0.9);
  roll  = THREE.MathUtils.clamp(roll  + iRoll*rollRate*dt,  -maxBank, maxBank);
  yaw   = yaw + (iYaw*yawRate + roll*0.6)*dt; // slight bank→yaw coupling for arcade feel

  // Auto-stabilize a bit
  roll  *= (1.0 - Math.min(autoLevel*dt, 0.12));
  pitch *= (1.0 - 0.40*dt);

  ship.rotation.set(pitch, yaw, roll);

  // ----- Move forward -----
  const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion).normalize();
  const v = cruiseSpeed * throttle;
  ship.position.addScaledVector(fwd, v*dt);

  // Keep above ground plane
  ship.position.y = Math.max(ship.position.y, -3.0);

  // Update camera
  updateChaseCam();

  // Render
  renderer.render(scene, camera);

  // HUD
  const padState = pad ? 'GAMEPAD' : 'KEYBOARD';
  hud.textContent =
`${padState}  THR ${(throttle*100|0)}%  SPD ${(v).toFixed(1)}
Pitch ${rad2deg(pitch)}°  Roll ${rad2deg(roll)}°  Yaw ${rad2deg(yaw % (Math.PI*2))}°
Center (${centerX.toFixed(2)}, ${centerY.toFixed(2)})  DZ ${DEADZONE}`;
}
requestAnimationFrame(loop);

function rad2deg(r){ return (r*180/Math.PI).toFixed(0); }

// Resize
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
