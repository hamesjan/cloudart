<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bare Bones Flight (Gamepad)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud"></div>
  <div id="help">
    <b>Controls</b><br>
    Left stick: pitch/roll<br>
    LB / RB: yaw<br>
    Btn 0: throttle up &nbsp;•&nbsp; Btn 1: throttle down<br>
    Keyboard: W/S (pitch), A/D (roll), Q/E (yaw), Space/Shift (throttle)
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
